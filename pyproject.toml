[project]
name = "familydraft"
version = "0.1.0"
description = "Same-family heterogeneous speculative-drafting mixture-of-experts for the Qwen3 family."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch",
    "transformers>=4.51",
    "datasets",
    "jsonschema",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/familydraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA GPU"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
