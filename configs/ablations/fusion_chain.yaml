# Ablation: chain vs DAG fusion (concept note §10.4, plan todo 22).
# Disables tree fusion: each branch is verified sequentially (per-branch full
# KV copy) instead of the single-forward tree verifier.

name: fusion_chain
description: "No candidate fusion - sequential per-branch verification (tree_verify=false)."
overrides:
  max_experts: 2
  routing_mode: utility
  tree_verify: false
  no_target_embedding: false
  no_online_feedback: false
